# Note: This workflow publishes its generated wheels to PyPI. Before pushing a
#       release tag, double-check that all bundled dependencies meet their
#       licensing criteria for redistribution.

# Note: PyPI must have a trusted publisher configured for this repository and
#       workflow file. No GitHub environment or API token is used.

# Note: Only Windows and Linux x86-64 wheels are published. Conda remains the
#       installation method for platforms not covered by these wheels.

name: Publish wheels to PyPI

on:
  push:
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+'
      - 'v?[0-9]+.[0-9]+.[0-9]+a[0-9]+'
      - 'v?[0-9]+.[0-9]+.[0-9]+b[0-9]+'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # MacOS: Not tried due to lack of priority
          - os: ubuntu-24.04
          - os: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # For now, we only build 3.11 and 3.13 wheels because these are the two that would go
          # into Blender 4 and 5 extensions respectively.
          CIBW_BUILD: "cp311-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          # This builds 64-bit x86 wheels. Support for Windows ARM could be added here, if it gets a thing.
          CIBW_ARCHS_WINDOWS: AMD64
          # Keep Linux on the same AlmaLinux 8/manylinux_2_28 base used by
          # docker/manylinux.dockerfile.
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_LINUX: >-
            SETUPTOOLS_SCM_SUBPROCESS_TIMEOUT=120
            CMAKE_PREFIX_PATH="/opt/cmake-compat:/opt/tinyxml2:/opt/lastools:/usr"
            LASTools_DIR="/opt/lastools"
            PATH="/opt/lastools/bin:$PATH"
            CMAKE_ARGS="-DBUILD_TESTING=OFF"
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y
            cmake
            git
            gdal-devel
            glm-devel
            zlib-devel
            boost-devel
            laszip-devel
            armadillo-devel
            lapack-devel
            cereal-devel
            && dnf clean all
            && git clone --depth 1 --branch 10.0.0
            https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
            && cmake -S /tmp/tinyxml2 -B /tmp/tinyxml2/build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=/opt/tinyxml2
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            -DBUILD_SHARED_LIBS=ON
            -Dtinyxml2_BUILD_TESTING=OFF
            && cmake --build /tmp/tinyxml2/build --parallel
            && cmake --install /tmp/tinyxml2/build
            && rm -rf /tmp/tinyxml2
            && git clone --depth 1 --branch v2.0.5
            https://github.com/LAStools/LAStools.git /tmp/LAStools
            && cmake -S /tmp/LAStools -B /tmp/LAStools/build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=/opt/lastools
            && cmake --build /tmp/LAStools/build --parallel
            && cmake --install /tmp/LAStools/build
            && rm -rf /tmp/LAStools
            && mkdir -p /opt/cmake-compat/GDAL /opt/cmake-compat/glm
            && printf '%s\n'
            'include("/usr/share/cmake/Modules/FindGDAL.cmake")'
            > /opt/cmake-compat/GDAL/GDALConfig.cmake
            && printf '%s\n'
            'include("/usr/share/cmake/glm/glmConfig.cmake")'
            'if(TARGET glm AND NOT TARGET glm::glm)'
            '  add_library(glm::glm ALIAS glm)'
            'endif()'
            > /opt/cmake-compat/glm/glmConfig.cmake
          CIBW_ENVIRONMENT_WINDOWS: >-
            SETUPTOOLS_SCM_SUBPROCESS_TIMEOUT=120
            CONDA_PREFIX=C:/helios-conda
            MAMBA_ROOT_PREFIX=C:/helios-micromamba-root
            PATH="C:/helios-conda/Library/bin;C:/helios-micromamba/Library/bin;$PATH"
            CMAKE_PREFIX_PATH="C:/helios-conda;C:/helios-conda/Library"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            python -m delvewheel repair
            --add-path C:/helios-conda/Library/bin
            -w {dest_dir} {wheel}
          CIBW_BEFORE_ALL_WINDOWS: >-
            python -c "import os, shutil, urllib.request;
            root = 'C:/helios-micromamba';
            archive = os.path.join(root, 'micromamba.tar.bz2');
            os.makedirs(root, exist_ok=True);
            urllib.request.urlretrieve('https://micro.mamba.pm/api/micromamba/win-64/latest', archive);
            shutil.unpack_archive(archive, root)"
            && micromamba --version
          CIBW_BEFORE_BUILD_WINDOWS: >-
            python -m pip install delvewheel &&
            python -c "import os, shutil, subprocess;
            prefix = os.environ['CONDA_PREFIX'];
            shutil.rmtree(prefix, ignore_errors=True);
            subprocess.check_call(['micromamba', 'create', '-y',
            '-p', prefix, '-f', 'environment-dev.yml', 'python=3.11'])"
        with:
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
