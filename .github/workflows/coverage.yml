name: Coverage testing

on:
  push:
    branches:
      - main
      - alpha-dev
  pull_request:
    branches:
      - main
      - alpha-dev
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Coverage Testing

    defaults:
      run:
        # Conda requires a login shell in order to work properly
        shell: bash -l {0}  

    env:
      CONDA_INSTALL_DIR: ${{ github.workspace }}/miniconda
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          installation-dir: ${{ env.CONDA_INSTALL_DIR }}
          auto-update-conda: true
          conda-remove-defaults: true
          channels: conda-forge
          auto-activate: false
          activate-environment: helios-dev
          python-version: "3.10"
          miniconda-version: "latest"

      - name: Restore conda environment cache
        id: conda-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CONDA_INSTALL_DIR }}/envs/helios-dev
          key: conda-env-v4-${{ runner.os }}-py3.10-${{ hashFiles('environment-dev.yml') }}

      - name: Pin Python version in environment file
        if: steps.conda-cache.outputs.cache-hit != 'true'
        run: |
          sed "s/^  - python$/  - python=3.10/" environment-dev.yml > environment-dev-ci.yml

      - name: Create Helios dev environment
        if: steps.conda-cache.outputs.cache-hit != 'true'
        run: |
          conda env update -n helios-dev -f environment-dev-ci.yml --prune || conda env create -n helios-dev -f environment-dev-ci.yml
          conda run -n helios-dev python --version

      - name: Install Conda GCC
        run: |
          conda install -y -c conda-forge gcc gxx
      
      - name: Install Linux test dependencies
        run: |
          sudo apt-get install --yes lcov libegl1

      - name: Install Open3D 
        run: |
          python -m pip install -U -f https://www.open3d.org/docs/latest/getting_started.html --only-binary open3d open3d

      - name: Install Helios (editable)
        run: |
          python -m pip install --no-build-isolation --config-settings=build-dir="build" --config-settings=cmake.build-type="Debug" --config-settings=cmake.define.CMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" -v -e .
        env:
          SETUPTOOLS_SCM_SUBPROCESS_TIMEOUT: "120"

      - name: Run C++ test suite
        run: |
          ctest --output-on-failure --test-dir build -C Debug

      - name: Run PyTest test suite
        run: |
          python -m pytest --cov --cov-report=xml 

      - name: Collect C++ coverage report
        run: |
          lcov --directory build --capture --output-file coverage.info --ignore-errors mismatch
      
      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage.info,./coverage.xml
          verbose: true
