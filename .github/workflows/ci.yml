name: CI

on:
  push:
    branches:
      - main
      - alpha-dev
  pull_request:
    branches:
      - main
      - alpha-dev
  workflow_dispatch:
    inputs:
      upload-outputs:
        description: 'Whether to upload outputs'
        default: false
        type: boolean

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  coverage:
    needs: changes
    if: ${{ needs.changes.outputs.coverage == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/coverage.yml

  build-and-test:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-and-test.yml
    with:
      upload-outputs: ${{ inputs.upload-outputs == true }}

  headercheck:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/headercheck.yml
