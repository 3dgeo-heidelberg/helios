[build-system]
requires = [
    "scikit-build-core",
    "setuptools_scm",
    "pybind11[global]",
]
build-backend = "scikit_build_core.build"

[project]
name = "helios"
dynamic = ["version"]
description = "The HELIOS++ Virtual Laser Scanning Simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "annotated-types",
    "backports.strenum; python_version < '3.11'",
    "click",
    "click-option-group",
    "clickqt-utils",
    "importlib-resources",
    "jsonschema",
    "laspy[lazrs]",
    "numpy",
    "numpydantic",
    "pint",
    "pydantic-core",
    "pydantic>=2",
    "PyYAML",
    "tqdm",
    "typing-extensions",
    "xmlschema",
    "vedo",
    "trame<3",
]
maintainers = [
    { name = "HELIOS++ dev team", email = "helios@uni-heidelberg.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
]

[project.scripts]
helios = "helios.__main__:cli"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["python/helios/_version.py"]

[tool.scikit-build.cmake]
version = ">=3.18"

[tool.scikit-build.cmake.define]
BUILD_DOCS = "OFF"
BUILD_PYTHON = "ON"
HELIOS_DATA_ANALYTICS = "0"
HELIOS_BUDDING_METRICS = "0"
# Executable built and installed during "pip install" should
# find the shared libaries of their dependencies without manual
# fiddling with LD_LIBRARY_PATH. As a downside, the built executables
# are not relocatable.
CMAKE_INSTALL_RPATH_USE_LINK_PATH = "ON"

[tool.setuptools_scm]  # Section required
version_file = "python/helios/_version.py"
version_file_template = '''
# file generated by setuptools-scm
# don't change, don't track in version control

__version__ = version = {version!r}
__version_tuple__ = version_tuple = {version_tuple!r}
__commit_id__ = commit_id = {scm_version.short_node!r}
'''

[tool.cibuildwheel]
# Super-verbose output for debugging purpose
build-verbosity = 3
# Testing commands for our wheels
test-sources = ["tests", "data"]
test-command = "python -m pytest tests/python"
test-requires = ["pytest"]
[tool.pytest.ini_options]
markers = [
    "exe: mark tests for the command line tool",
    "pyh: mark tests for the python bindings pyhelios",
    "open3d: tests requiring Open3D",
]
testpaths = [
    "tests/python",
]
